name: Mecandjeo School CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mecandjeo-school/**'
      - 'resources/school/**'
      - 'modules/**'
      - '.github/workflows/school-cicd.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'apps/mecandjeo-school/**'
      - 'resources/school/**'
      - 'modules/**'
      - '.github/workflows/school-cicd.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.0"
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: mecandjeo-school-platform-dev
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # FRONTEND CI
  # React/Vite quality gates.
  # Build includes TypeScript validation.
  # ============================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mecandjeo-school/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mecandjeo-school/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build


  # ============================================================
  # BACKEND CI
  # Validate Python application syntax and dependencies.
  # ============================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mecandjeo-school

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/mecandjeo-school/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Validate Python source
        run: python -m compileall app


  # ============================================================
  # TERRAFORM CI
  # Validate school infrastructure and produce a plan.
  # ============================================================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: resources/school/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_DEV }}" \
            -backend-config="key=mecandjeo-school/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars.pipeline" \
            -var="container_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" \
            -no-color | tee terraform-plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-school
          path: resources/school/dev/terraform-plan.txt
          retention-days: 5


  # ============================================================
  # DOCKER BUILD
  # Build and tag the backend image for downstream CI stages.
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - terraform-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      image_name: ${{ steps.build.outputs.image_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        id: build
        run: |
          SHORT_TAG="${IMAGE_TAG:0:8}"
          IMAGE_NAME="mecandjeo-school-platform-dev"

          echo "Building Mecandjeo School backend..."
          echo "Image: ${IMAGE_NAME}:${SHORT_TAG}"

          docker build \
            --file apps/mecandjeo-school/Dockerfile \
            --tag ${IMAGE_NAME}:${SHORT_TAG} \
            apps/mecandjeo-school/

          echo "image_tag=${SHORT_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Inspect Docker Image
        run: |
          docker image inspect \
            "${{ steps.build.outputs.image_name }}:${{ steps.build.outputs.image_tag }}" \
            --format 'Image: {{.RepoTags}} | User: {{.Config.User}} | Size: {{.Size}} bytes'

      - name: Save Docker Image
        run: |
          docker save \
            "${{ steps.build.outputs.image_name }}:${{ steps.build.outputs.image_tag }}" \
            --output school-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-docker-image-${{ steps.build.outputs.image_tag }}
          path: school-image.tar
          retention-days: 5