name: Mecandjeo School CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mecandjeo-school/**'
      - 'resources/school/**'
      - 'modules/**'
      - '.github/workflows/school-cicd.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'apps/mecandjeo-school/**'
      - 'resources/school/**'
      - 'modules/**'
      - '.github/workflows/school-cicd.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.0"
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: mecandjeo-school-platform-dev
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # FRONTEND CI
  # React/Vite quality gates.
  # Build includes TypeScript validation.
  # ============================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mecandjeo-school/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mecandjeo-school/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build


  # ============================================================
  # BACKEND CI
  # Validate Python application syntax and dependencies.
  # ============================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mecandjeo-school

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/mecandjeo-school/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Validate Python source
        run: python -m compileall app


  # ============================================================
  # TERRAFORM CI
  # Validate school infrastructure and produce a plan.
  # ============================================================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: resources/school/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_DEV }}" \
            -backend-config="key=mecandjeo-school/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars.pipeline" \
            -var="container_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" \
            -no-color | tee terraform-plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-school
          path: resources/school/dev/terraform-plan.txt
          retention-days: 5


  # ============================================================
  # DOCKER
  # Build and push the backend image to Amazon ECR.
  # ============================================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - terraform-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        id: build
        run: |
          SHORT_TAG="${IMAGE_TAG:0:8}"
          FULL_ECR_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "Building Mecandjeo School backend..."
          echo "Image tag: ${SHORT_TAG}"
          echo "ECR URI: ${FULL_ECR_URI}"

          docker build \
            --file apps/mecandjeo-school/Dockerfile \
            --tag ${FULL_ECR_URI}:${SHORT_TAG} \
            --tag ${FULL_ECR_URI}:latest \
            apps/mecandjeo-school/

          docker push ${FULL_ECR_URI}:${SHORT_TAG}
          docker push ${FULL_ECR_URI}:latest

          echo "image_uri=${FULL_ECR_URI}:${SHORT_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHORT_TAG}" >> "$GITHUB_OUTPUT"


  # ============================================================
  # DEPLOY DEV
  # Terraform updates ECS with the newly built image.
  # ============================================================
  deploy-dev:
    name: Deploy School to Dev
    runs-on: ubuntu-latest

    needs:
      - frontend-ci
      - backend-ci
      - terraform-ci
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: resources/school/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_DEV }}" \
            -backend-config="key=mecandjeo-school/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        id: apply
        working-directory: resources/school/dev
        run: |
          terraform apply \
            -auto-approve \
            -var-file="terraform.tfvars.pipeline" \
            -var="container_image=${{ needs.docker.outputs.image_uri }}" \
            -no-color

          echo "school_alb_dns_name=$(terraform output -raw school_alb_dns_name)" >> "$GITHUB_OUTPUT"
          echo "school_ecs_cluster=$(terraform output -raw school_ecs_cluster)" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS Service Stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.apply.outputs.school_ecs_cluster }}" \
            --services mecandjeo-school-dev-service \
            --region "${{ env.AWS_REGION }}"

      - name: Verify Application Health
        run: |
          ALB_DNS="${{ steps.apply.outputs.school_alb_dns_name }}"
          URL="http://${ALB_DNS}/health"

          echo "Checking: ${URL}"

          STATUS="000"

          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${URL}" || true)

            echo "Attempt ${i}: HTTP ${STATUS}"

            if [ "${STATUS}" = "200" ]; then
              echo "School application is healthy."
              exit 0
            fi

            sleep 10
          done

          echo "Application health check failed."
          exit 1

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "  MECANDJEO SCHOOL DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo "Environment : dev"
          echo "Image       : ${{ needs.docker.outputs.image_uri }}"
          echo "Tag         : ${{ needs.docker.outputs.image_tag }}"
          echo "Commit      : ${{ github.sha }}"
          echo "Branch      : ${{ github.ref_name }}"
          echo "School      : http://${{ steps.apply.outputs.school_alb_dns_name }}"
          echo "=========================================="