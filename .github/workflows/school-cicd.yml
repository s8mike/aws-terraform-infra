name: Mecandjeo School CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mecandjeo-school/**'
      - 'resources/school/**'
      - 'modules/**'
      - '.github/workflows/school-cicd.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'apps/mecandjeo-school/**'
      - 'resources/school/**'
      - 'modules/**'
      - '.github/workflows/school-cicd.yml'

  workflow_dispatch:
    inputs:
      rollback_image_tag:
        description: "Existing ECR image tag to deploy for rollback"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.0"
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: mecandjeo-school-platform-dev
  IMAGE_TAG: ${{ github.sha }}

  # Production API URL injected into the Vite build at CI time.
  VITE_API_BASE_URL: ${{ vars.SCHOOL_FRONTEND_API_URL }}

jobs:

  # ============================================================
  # FRONTEND CI
  # React/Vite quality gates.
  # Build includes TypeScript validation.
  # ============================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    # Skip application CI during manual rollback.
    if: github.event_name != 'workflow_dispatch'

    defaults:
      run:
        working-directory: apps/mecandjeo-school/frontend

    steps:

      # Checkout the repository source code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the Node.js version used by the frontend project.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mecandjeo-school/frontend/package-lock.json

      # Install the exact dependency versions from package-lock.json.
      - name: Install frontend dependencies
        run: npm ci

      # Run the frontend linting checks.
      - name: Lint frontend
        run: npm run lint

      # Build the production frontend.
      # npm run build performs TypeScript validation and Vite production build.
      - name: Build frontend
        run: npm run build

      # Preserve the CI-validated frontend build for the deployment job.
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-frontend-dist-${{ github.sha }}
          path: apps/mecandjeo-school/frontend/dist
          retention-days: 5


  # ============================================================
  # FRONTEND DEPLOYMENT
  # Deploy the exact frontend build artifact that passed CI.
  # Only runs after Frontend CI succeeds on a push to main.
  # ============================================================
  frontend-deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    # Deploy only production builds from the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Frontend deployment must wait for the validated frontend build.
    needs:
      - frontend-ci

    steps:

      # Download the exact dist/ artifact produced by Frontend CI.
      - name: Download frontend build artifact
        uses: actions/download-artifact@v5
        with:
          name: school-frontend-dist-${{ github.sha }}
          path: frontend-dist

      # Configure AWS credentials for S3 and CloudFront operations.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify the downloaded frontend artifact before deployment.
      - name: Verify frontend build artifact
        run: |
          test -f frontend-dist/index.html
          echo "Frontend build artifact verified."

      # Deploy the approved frontend build to the private S3 bucket.
      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend-dist/ \
            "s3://${{ vars.SCHOOL_FRONTEND_BUCKET }}" \
            --delete
          # --delete removes destination objects that are no longer present
          # in the current frontend build, keeping S3 synchronized with dist/.
          # This does not delete the S3 bucket itself.

      # Invalidate CloudFront so the new frontend files are served immediately.
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.SCHOOL_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"


  # ============================================================
  # BACKEND CI
  # Validate the FastAPI backend source code.
  # ============================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    # Skip application CI during manual rollback.
    if: github.event_name != 'workflow_dispatch'

    defaults:
      run:
        working-directory: apps/mecandjeo-school

    steps:

      # Checkout the repository source code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the Python version used by the backend.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/mecandjeo-school/requirements.txt

      # Install backend dependencies.
      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # Compile Python source files to detect syntax errors.
      - name: Validate Python source
        run: python -m compileall app


  # ============================================================
  # TERRAFORM CI
  # Validate school infrastructure and produce a plan.
  # ============================================================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    # Skip validation plan during manual rollback.
    if: github.event_name != 'workflow_dispatch'

    defaults:
      run:
        working-directory: resources/school/dev

    steps:

      # Checkout the repository source code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the pinned Terraform version used by the pipeline.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Configure AWS credentials for Terraform operations.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify Terraform formatting.
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Initialize Terraform using the configured remote state backend.
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_DEV }}" \
            -backend-config="key=mecandjeo-school/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      # Validate the Terraform configuration.
      - name: Terraform Validate
        run: terraform validate

      # Generate the Terraform execution plan without applying changes.
      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars.pipeline" \
            -var="container_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" \
            -no-color | tee terraform-plan.txt

      # Preserve the Terraform plan as a workflow artifact.
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-school
          path: resources/school/dev/terraform-plan.txt
          retention-days: 5


  # ============================================================
  # DOCKER BUILD
  # Build and tag the backend image for downstream CI stages.
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    # Docker build requires all three validation stages to pass.
    needs:
      - frontend-ci
      - backend-ci
      - terraform-ci

    # Build production images only from the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      image_name: ${{ steps.build.outputs.image_name }}

    steps:

      # Checkout the repository source code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Enable Docker Buildx for image builds.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the backend Docker image and expose its tag as a job output.
      - name: Build Docker Image
        id: build
        run: |
          SHORT_TAG="${IMAGE_TAG:0:8}"
          IMAGE_NAME="mecandjeo-school-platform-dev"

          echo "Building Mecandjeo School backend..."
          echo "Image: ${IMAGE_NAME}:${SHORT_TAG}"

          docker build \
            --file apps/mecandjeo-school/Dockerfile \
            --tag ${IMAGE_NAME}:${SHORT_TAG} \
            apps/mecandjeo-school/

          echo "image_tag=${SHORT_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # Inspect the built image metadata before publishing it.
      - name: Inspect Docker Image
        run: |
          docker image inspect \
            "${{ steps.build.outputs.image_name }}:${{ steps.build.outputs.image_tag }}" \
            --format 'Image: {{.RepoTags}} | User: {{.Config.User}} | Size: {{.Size}} bytes'

      # Save the exact Docker image as an artifact for downstream jobs.
      - name: Save Docker Image
        run: |
          docker save \
            "${{ steps.build.outputs.image_name }}:${{ steps.build.outputs.image_tag }}" \
            --output school-image.tar

      # Upload the immutable Docker image artifact.
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-docker-image-${{ steps.build.outputs.image_tag }}
          path: school-image.tar
          retention-days: 5


  # ============================================================
  # CONTAINER SECURITY SCAN
  # Scan the exact Docker image artifact produced by docker-build.
  # ============================================================
  container-security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    # Security scanning requires the Docker build to succeed.
    needs:
      - docker-build

    # Run the production security gate only on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # Download the exact Docker image produced by docker-build.
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v5
        with:
          name: school-docker-image-${{ needs.docker-build.outputs.image_tag }}

      # Verify that the Docker image artifact exists.
      - name: Verify Docker Image Artifact
        run: |
          ls -lh school-image.tar
          test -f school-image.tar

      # Scan the Docker image for HIGH and CRITICAL vulnerabilities.
      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: school-image.tar
          pkg-types: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table


  # ============================================================
  # ECR PUBLISH
  # Publish the exact Docker image artifact that passed security.
  # ============================================================
  ecr-publish:
    name: Publish Image to ECR
    runs-on: ubuntu-latest

    # Publishing requires both the image build and security scan.
    needs:
      - docker-build
      - container-security-scan

    # Publish production images only from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # Configure AWS credentials for ECR operations.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify that the target ECR repository exists.
      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      # Download the exact Docker image that passed security scanning.
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v5
        with:
          name: school-docker-image-${{ needs.docker-build.outputs.image_tag }}

      # Verify that the Docker image artifact exists.
      - name: Verify Docker Image Artifact
        run: |
          ls -lh school-image.tar
          test -f school-image.tar

      # Load the Docker image into the local Docker daemon.
      - name: Load Docker Image
        run: |
          docker load --input school-image.tar

      # Authenticate Docker with Amazon ECR.
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Tag the validated image with its ECR repository URI.
      - name: Tag Image for ECR
        run: |
          LOCAL_IMAGE="${{ needs.docker-build.outputs.image_name }}:${{ needs.docker-build.outputs.image_tag }}"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ needs.docker-build.outputs.image_tag }}"

          echo "Local image: ${LOCAL_IMAGE}"
          echo "ECR image: ${ECR_IMAGE}"

          docker tag "${LOCAL_IMAGE}" "${ECR_IMAGE}"

      # Push the validated image to ECR.
      - name: Push Image to ECR
        run: |
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ needs.docker-build.outputs.image_tag }}"

          echo "Publishing image to ECR..."
          docker push "${ECR_IMAGE}"

      # Verify that the image was successfully published to ECR.
      - name: Verify ECR Image
        run: |
          IMAGE_TAG="${{ needs.docker-build.outputs.image_tag }}"

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[0].{Tag:imageTags[0],Digest:imageDigest,Size:imageSizeInBytes}' \
            --output table


  # ============================================================
  # ECS DEPLOYMENT
  # Deploy the exact immutable image published to ECR.
  # ============================================================
  ecs-deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest

    # ECS deployment requires the built image and successful ECR publish.
    needs:
      - docker-build
      - ecr-publish

    # Deploy production infrastructure only from main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: resources/school/dev

    steps:

      # Checkout the repository source code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the pinned Terraform version.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Configure AWS credentials for Terraform deployment.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Initialize Terraform against the remote state backend.
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_DEV }}" \
            -backend-config="key=mecandjeo-school/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      # Build the immutable ECR image URI for deployment.
      - name: Build Deployment Image URI
        run: |
          IMAGE_TAG="${{ needs.docker-build.outputs.image_tag }}"
          ECR_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"

          echo "Deployment image:"
          echo "${ECR_IMAGE}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "ECR_IMAGE=${ECR_IMAGE}" >> "$GITHUB_ENV"

      # Create the Terraform deployment plan using the published image.
      - name: Terraform Plan
        run: |
          echo "Planning School ECS deployment..."
          echo "Container image: ${ECR_IMAGE}"

          terraform plan \
            -var-file="terraform.tfvars.pipeline" \
            -var="container_image=${ECR_IMAGE}" \
            -out=ecs-deployment.tfplan

      # Apply the reviewed Terraform deployment plan.
      - name: Terraform Apply
        run: |
          echo "Applying School ECS deployment..."
          echo "Container image: ${ECR_IMAGE}"

          terraform apply \
            -auto-approve \
            ecs-deployment.tfplan


  # ============================================================
  # MANUAL ROLLBACK
  # Redeploy a previously published immutable ECR image.
  # ============================================================
  ecs-rollback:
    name: Rollback ECS Deployment
    runs-on: ubuntu-latest

    # Rollback is available only through manual workflow dispatch on main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: resources/school/dev

    steps:

      # Checkout the repository source code.
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the pinned Terraform version.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Configure AWS credentials for ECR and Terraform.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify that the requested rollback image exists in ECR.
      - name: Verify ECR Image
        run: |
          IMAGE_TAG="${{ inputs.rollback_image_tag }}"

          echo "Verifying rollback image:"
          echo "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[0].{Tags:imageTags,Digest:imageDigest,Pushed:imagePushedAt}' \
            --output table

      # Initialize Terraform against the remote state backend.
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET_DEV }}" \
            -backend-config="key=mecandjeo-school/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      # Build the immutable ECR image URI selected for rollback.
      - name: Build Rollback Image URI
        run: |
          IMAGE_TAG="${{ inputs.rollback_image_tag }}"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Rollback image:"
          echo "${ECR_IMAGE}"

          echo "ECR_IMAGE=${ECR_IMAGE}" >> "$GITHUB_ENV"

      # Create the Terraform rollback plan.
      - name: Terraform Plan
        run: |
          echo "Planning ECS rollback..."
          echo "Container image: ${ECR_IMAGE}"

          terraform plan \
            -var-file="terraform.tfvars.pipeline" \
            -var="container_image=${ECR_IMAGE}" \
            -out=ecs-rollback.tfplan

      # Apply the Terraform rollback plan.
      - name: Terraform Apply
        run: |
          echo "Applying ECS rollback..."
          echo "Container image: ${ECR_IMAGE}"

          terraform apply \
            -auto-approve \
            ecs-rollback.tfplan