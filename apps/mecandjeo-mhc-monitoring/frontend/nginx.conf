# nginx settings for the frontend container: serves the built React app and forwards API calls to the backend.
# Docker's built-in DNS (127.0.0.11) lets nginx find the backend by its service name and re-check it every 10 seconds.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Headers added to every response (the same ones the backend adds).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Compress text files before sending them.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Answered by nginx itself: used by the container health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Backend health check, forwarded to the backend container.
  location = /health {
    set $backend http://crane-app:8004;
    proxy_pass $backend;
  }

  # The API, forwarded to the backend container with the original address and headers.
  location /api/ {
    set $backend http://crane-app:8004;
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Built files carry a content hash in their name, so browsers may keep them for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Any other address belongs to the React app, so a refresh on /operator still works.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}