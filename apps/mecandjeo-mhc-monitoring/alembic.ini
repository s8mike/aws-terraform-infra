# Alembic settings: where the migration scripts live and how migration messages are logged.
# The database address is not stored here: migrations/env.py reads it from DATABASE_URL.

[alembic]
# The folder that holds env.py and the versions folder.
script_location = %(here)s/migrations
# Migration files are named like 0001_baseline.py so their order is obvious.
file_template = %%(rev)s_%%(slug)s
# Lets env.py import the application package ("app") when Alembic runs from this folder.
prepend_sys_path = .
path_separator = os

# Logging configuration, used by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S