# Local stack: PostgreSQL, a one-off migration job, the API, and the web frontend.
# Health checks run every 'interval' seconds, but during 'start_period' they run every 'start_interval' seconds,
# so a container that is ready reports healthy within a few seconds instead of waiting a full interval.
# Start order: crane-db (healthy) -> crane-migrate (runs to completion) -> crane-app (healthy) -> crane-web (healthy).
services:
  # Phase 11: one-off job that brings the database schema up to date and then exits (restart is off on purpose).
  crane-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: crane-migrate
    env_file:
      - .env.docker
    command: ["alembic", "upgrade", "head"]
    depends_on:
      crane-db:
        condition: service_healthy
    restart: "no"
    networks:
      - crane-network

  crane-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: crane-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${APP_PORT}:8004"
    depends_on:
      crane-db:
        condition: service_healthy
      crane-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 2s
    networks:
      - crane-network

  crane-db:
    image: ${POSTGRES_IMAGE}:${POSTGRES_VERSION}
    container_name: crane-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - crane-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    networks:
      - crane-network

  # Phase 11: the web frontend (nginx serving the built React app and forwarding /api to the backend).
  crane-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${WEB_IMAGE_NAME:-mecandjeo-mhc-web}:${IMAGE_TAG:-dev}
    container_name: crane-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      crane-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    networks:
      - crane-network

volumes:
  crane-postgres-data:

networks:
  crane-network:
    driver: bridge